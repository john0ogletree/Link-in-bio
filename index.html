<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Ogletree — Links</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1f1f1f;
      --border: #262626;
      --text-primary: #ededed;
      --text-secondary: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      background-color: var(--surface);
    }

    .name {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 32px;
      max-width: 340px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      text-decoration: none;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .link-card:hover {
      background-color: var(--surface-hover);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    .link-card:active {
      transform: translateY(0);
    }

    .socials {
      display: flex;
      gap: 20px;
      margin-top: 36px;
    }

    .socials a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s ease;
    }

    .socials a:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="avatar" src="https://via.placeholder.com/150/141414/888888?text=JO" alt="John Ogletree" />

    <h1 class="name">John Ogletree</h1>
    <p class="bio">Independent developer, designer, and creator.</p>

    <div class="links">
      <a class="link-card" href="https://jao.life" target="_blank" rel="noopener">Website</a>
      <a class="link-card" href="https://books.jao.life" target="_blank" rel="noopener">Books</a>
      <a class="link-card" href="https://github.com/john0ogletree" target="_blank" rel="noopener">GitHub</a>
    </div>

    <div class="socials">
      <a href="https://bsky.app/profile/jao.life" target="_blank" rel="noopener">Bluesky</a>
      <a href="https://twitch.tv/john00ogletree" target="_blank" rel="noopener">Twitch</a>
      <a href="https://buymeacoffee.com/john0ogletree" target="_blank" rel="noopener">Support</a>
    </div>
  </main>
</body>
</html>
