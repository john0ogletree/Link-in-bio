<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Ogletree — Links</title>
  <style>
    /* Theme & Color Tokens */
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1f1f1f;
      --border: #262626;
      --text-primary: #ededed;
      --text-secondary: #888888;
    }

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 6vw, 80px) clamp(12px, 5vw, 32px);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Profile Header */
    .name {
      font-size: clamp(1.05rem, 3.5vw, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: clamp(4px, 1vw, 8px);
    }

    .bio {
      font-size: clamp(0.75rem, 2.5vw, 1.05rem);
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
      margin-bottom: clamp(20px, 5vw, 40px);
      max-width: min(90vw, 460px);
    }

    /* Primary Link Cards */
    .links {
      width: 100%;
      max-width: 560px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(8px, 2vw, 14px);
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: clamp(10px, 2.5vw, 18px) clamp(12px, 3vw, 24px);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: clamp(8px, 2vw, 14px);
      color: var(--text-primary);
      text-decoration: none;
      text-align: center;
      font-size: clamp(0.8rem, 2.5vw, 1.05rem);
      font-weight: 500;
      line-height: 1.2;
      word-break: break-word;
      transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .link-card:hover {
      background-color: var(--surface-hover);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    .link-card:active {
      transform: translateY(0);
    }

    /* Smartwatch & Ultra-Small Viewports (< 240px) */
    @media (max-width: 240px) {
      body {
        justify-content: flex-start;
        padding: 14px 10px 24px;
      }

      .bio {
        margin-bottom: 14px;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .link-card {
        min-height: 38px;
        padding: 9px 10px;
        border-radius: 10px;
      }
    }

    /* Tablets & Small Laptops (768px+) */
    @media (min-width: 768px) {
      .links {
        max-width: 640px;
      }
    }

    /* Large Desktops, 4K & Ultrawide Displays (1440px+) */
    @media (min-width: 1440px) {
      .links {
        max-width: 760px;
        gap: 16px;
      }

      .link-card {
        padding: 20px 28px;
      }
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <h1 class="name">John Ogletree</h1>
  <p class="bio">Independent developer, designer, and creator.</p>

  <!-- Primary Links -->
  <div class="links">
    <a class="link-card" href="https://jao.life" target="_blank" rel="noopener">Website</a>
    <a class="link-card" href="https://github.com/john0ogletree" target="_blank" rel="noopener">GitHub</a>
    <a class="link-card" href="https://bsky.app/profile/jao.life" target="_blank" rel="noopener">Bluesky</a>
    <a class="link-card" href="https://facebook.com/John0ogletree" target="_blank" rel="noopener">Facebook</a>
    <a class="link-card" href="https://x.com/John0ogletree" target="_blank" rel="noopener">X (Twitter)</a>
    <a class="link-card" href="https://instagram.com/John0ogletree" target="_blank" rel="noopener">Instagram</a>
    <a class="link-card" href="https://tiktok.com/@John0ogletree" target="_blank" rel="noopener">TikTok</a>
  </div>
</body>
</html>
